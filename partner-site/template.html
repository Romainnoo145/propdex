<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <header class="glass hero">
      <span class="hero-eyebrow">{{EYEBROW}}</span>
      <h1>{{HEADING}}</h1>
      <p class="hero-meta">{{META}}</p>
    </header>

    <article class="glass">
      {{CONTENT}}
    </article>

    <aside class="cross-link">
      <span>{{CROSSLINK_TEXT}}</span>
      <a href="{{CROSSLINK_HREF}}">{{CROSSLINK_LABEL}} →</a>
    </aside>

    <footer class="site-footer">
      <strong>Propdex BV (in oprichting)</strong> · gezamenlijke onderneming van Klarifai BV en Partner Holding BV<br />
      Vertrouwelijk — niet bedoeld voor verspreiding zonder toestemming · <span>info@klarifai.nl</span>
    </footer>
  </main>
</body>
</html>
