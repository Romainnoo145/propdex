[project]
name = "propdex-api"
version = "0.1.0"
description = "Propdex API - Property Intelligence Platform"
authors = [
    {name = "Klarifai", email = "info@klarifai.nl"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiolimiter>=1.2.0",
    "alembic>=1.13.0",
    "anthropic>=0.40.0",
    "deepeval>=2.0.0",
    "arq>=0.27.0",
    "asyncpg>=0.29.0",
    "fastapi[standard]>=0.115.0",
    "google-genai>=1.0.0",
    "fastapi-mail>=1.4.1",
    "geoalchemy2>=0.15.0",
    "httpx[http2]>=0.27.0",
    "httpx-oauth>=0.14.0",
    "jinja2>=3.1.0",
    "lxml>=5.3.0",
    "openpyxl>=3.1.0",
    "pydantic-settings>=2.1.0",
    "pwdlib[argon2]>=0.2.0",
    "pyjwt[crypto]>=2.9.0",
    "pyproj>=3.7.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "scrapling[fetchers]>=0.4.1",
    "shapely>=2.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.25",
    "sse-starlette>=1.0.0",
    "weasyprint>=68.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.26.0",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",
    "pytest-factoryboy>=2.6.0",
    "faker>=20.0.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in argument defaults (false positive for FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "google.*",
    "google.genai.*",
    "arq.*",
    "fastapi_mail.*",
    "httpx_oauth.*",
    "slowapi.*",
    "weasyprint.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:asyncio",
    "ignore::DeprecationWarning:pytest_asyncio",
    "ignore::DeprecationWarning:slowapi",
    "ignore::DeprecationWarning:arq",
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
