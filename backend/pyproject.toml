[project]
name = "crmplus-api"
version = "0.1.0"
description = "CRM Plus API - Property Intelligence Platform"
authors = [
    {name = "Klarifai", email = "info@klarifai.nl"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pyjwt[crypto]>=2.9.0",
    "pwdlib[argon2]>=0.2.0",
    "python-multipart>=0.0.9",
    "httpx[http2]>=0.27.0",
    "httpx-oauth>=0.14.0",
    "fastapi-mail>=1.4.1",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.26.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "slowapi.*",
    "fastapi_mail.*",
    "httpx_oauth.*",
]
ignore_missing_imports = true
